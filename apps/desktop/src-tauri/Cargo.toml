[package]
name = "joydsh-desktop"
version = "0.0.0"
description = "JoyDSH 手柄优先的智能体工作空间"
authors = ["JoyDSH contributors"]
edition = "2021"

[lib]
name = "joydsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = "0.27"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }
